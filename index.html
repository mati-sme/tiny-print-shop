<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a1a10">
<meta name="description" content="Tiny Print Shop: run a cozy little 3D-printing shop against the clock. Fix clogged nozzles, keep customers happy, make it to the expo.">
<title>Tiny Print Shop</title>
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- in-season HUD -->
  <div id="hud" class="hidden">
    <div class="topbar" id="topbar">
      <span class="chip money" title="Money"><i data-ic="coin"></i><b id="hMoney">0</b></span>
      <span class="chip" title="Shop rating"><i data-ic="star"></i><b id="hRating">3.0</b></span>
      <span class="chip timer" title="Time until the expo"><i data-ic="expo"></i><b id="hTime">10:00</b><i class="tbar"><i id="hTimeBar"></i></i></span>
      <span class="chip rent" id="hRentChip" title="Next rent"><i data-ic="house"></i><b id="hRent">$60</b><small id="hRentT">2:30</small></span>
      <span class="grow"></span>
      <button class="round" id="btnSpeed" aria-label="Speed"><i data-ic="fast"></i><small id="speedTxt">1x</small></button>
      <button class="round" id="btnPause" aria-label="Pause"><i data-ic="pause"></i></button>
    </div>
    <div id="goalBar" class="goalbar hidden"><i id="goalIc" class="gic"></i><span class="gtxt"><small id="goalN">Goal 1</small><b id="goalTxt"></b></span><span class="gprog"><i id="goalProg"></i></span><span class="grew" id="goalRew"></span></div>
    <div id="tray">
      <div class="tray-head">
        <span class="th-title"><i data-ic="inbox"></i><b id="ordCount">0</b></span>
        <div class="inv" id="inv"></div>
      </div>
      <div id="orders" class="orders"></div>
      <div class="actions">
        <button class="act" id="btnShop"><i data-ic="cart"></i><small>Supplies</small></button>
        <button class="act" id="btnUps"><i data-ic="tools"></i><small>Upgrades</small><i class="dot hidden" id="dotUps"></i></button>
        <button class="act" id="btnHelp"><i data-ic="help"></i><small>Help</small></button>
      </div>
    </div>
    <div id="hint" class="hidden"></div>
    <div id="pointer" class="hidden"><i data-ic="hand"></i></div>
    <button id="skipTut" class="hidden">Skip tutorial</button>
  </div>

  <!-- between seasons -->
  <div id="home" class="hidden">
    <header class="hometop">
      <div class="logo"><span class="lg-b">Tiny Print</span> <span class="lg-l">Shop</span></div>
      <div class="wallet"><span class="chip" title="Reputation"><i data-ic="medal"></i><b id="repTxt">0</b></span><span class="chip hidden" id="trophyChip" title="Trophies"><i data-ic="trophy"></i><b id="trophyTxt">0</b></span>
        <button class="round small" id="btnMusic" aria-label="Music"></button><button class="round small" id="btnSfx" aria-label="Sound effects"></button></div>
    </header>
    <section class="tab" id="tab-lab">
      <div class="spacer"></div>
      <div class="card home-card">
        <div class="homegoal hidden" id="homeGoal"></div>
        <div class="labline" id="labLine"></div>
        <button class="big-go" id="btnGo"><span id="goTxt">Start season</span><small id="goSub">~10 min, expo at the end</small></button>
        <div class="records" id="records"></div>
      </div>
    </section>
    <section class="tab hidden" id="tab-research">
      <div class="maphead"><b><i data-ic="flask"></i> Research</b><span>Spend Reputation <i data-ic="medal"></i>. Kept between seasons.</span></div>
      <div class="mapwrap" id="resMap"></div>
    </section>
    <section class="tab hidden" id="tab-labs">
      <div class="maphead"><b><i data-ic="map"></i> Your labs</b><span id="labsSub">Move up to a bigger lab to prestige.</span></div>
      <div class="mapwrap" id="labMap"></div>
    </section>
    <section class="tab hidden" id="tab-more">
      <div class="card settings" id="helpCard"></div>
    </section>
    <nav class="tabs">
      <button data-tab="lab" class="on"><i data-ic="garage"></i><small>Lab</small></button>
      <button data-tab="research"><i data-ic="flask"></i><small>Research</small><i class="dot hidden" id="dotRes"></i></button>
      <button data-tab="labs"><i data-ic="map"></i><small>Labs</small><i class="dot hidden" id="dotLabs"></i></button>
      <button data-tab="more"><i data-ic="gear"></i><small>More</small></button>
    </nav>
  </div>

  <div id="sheet" class="modal hidden"><div class="sheet card" id="sheetCard"></div></div>
  <div id="alert" class="modal hidden"><div class="alertcard" id="alertCard"></div></div>
  <div id="pauseMenu" class="modal hidden"><div class="card pausecard" id="pauseCard"></div></div>
  <div id="summary" class="modal hidden"><div class="card" id="sumCard"></div></div>
  <div id="goalPop" class="hidden"></div>
  <div id="toast"></div>
  <div id="boot"><div class="bootlogo"><span class="lg-b">Tiny Print</span> <span class="lg-l">Shop</span></div></div>
</div>
<script src="js/platform.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/icons.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
</body>
</html>
