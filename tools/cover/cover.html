<!doctype html>
<!-- Tiny Print Shop cover art, drawn entirely in code (canvas). ?w=1920&h=1080[&t=seconds]
     A big friendly printer printing a little figurine on a workbench at golden hour, plus the title. Used by make-covers.js / make-videos.js. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Fredoka'; src: url('../../fonts/fredoka.woff') format('woff'); font-weight: 300 700; }
html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }
</style></head><body><canvas id="c"></canvas>
<script src="../../js/data.js"></script><script src="../../js/core.js"></script><script src="../../js/models.js"></script>
<script src="../../js/icons.js"></script><script src="../../js/render.js"></script>
<script>
const q = new URLSearchParams(location.search), W = +q.get('w') || 1920, H = +q.get('h') || 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const R = BL.Render, MD = BL.Models;
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function slab(cx, cy, k, w, d, h, top, left, right) { // iso box centred on its top-front corner area
  const P = (x, y, z) => [cx + (x - y) * k, cy + (x + y) * k / 2 - z * k];
  const f = (pts, c) => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p))); g.closePath(); g.fillStyle = c; g.fill(); };
  f([P(0, 0, h), P(w, 0, h), P(w, d, h), P(0, d, h)], top);
  f([P(0, d, h), P(w, d, h), P(w, d, 0), P(0, d, 0)], left);
  f([P(w, 0, h), P(w, d, h), P(w, d, 0), P(w, 0, 0)], right);
  return P;
}
function leaf(x, y, s, a, c) { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = c; g.beginPath(); g.ellipse(0, 0, s, s * 0.45, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(30,60,20,.35)'; g.lineWidth = Math.max(1, s * 0.12); g.beginPath(); g.moveTo(-s * 0.8, 0); g.lineTo(s * 0.8, 0); g.stroke(); g.restore(); }
function cube(x, y, s, c) { // a tiny floating printed cube
  const f = (pts, col) => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p))); g.closePath(); g.fillStyle = col; g.fill(); };
  const sh = (hex, k) => BL.Models.shade(hex, k);
  f([[x, y - s], [x + s, y - s / 2], [x, y], [x - s, y - s / 2]], sh(c, 0.15));
  f([[x - s, y - s / 2], [x, y], [x, y + s], [x - s, y + s / 2]], c);
  f([[x + s, y - s / 2], [x, y], [x, y + s], [x + s, y + s / 2]], sh(c, -0.25));
}
function title(cx, cy, size, align) { // two lines: "Tiny Print" / "Shop"
  g.textBaseline = 'alphabetic'; g.lineJoin = 'round'; g.textAlign = 'left';
  g.font = `700 ${size}px Fredoka`;
  const lines = [['Tiny Print', '#fff6e6'], ['Shop', '#7fdcec']];
  const depth = Math.round(size * 0.085);
  lines.forEach(([t, col], li) => {
    const w = g.measureText(t).width, x = align === 'left' ? cx : cx - w / 2, y = cy + li * size * 0.98;
    for (let d = depth; d > 0; d--) { g.fillStyle = d === depth ? 'rgba(40,20,8,.45)' : '#4a2a14'; g.fillText(t, x + d * 0.35, y + d); }
    g.strokeStyle = '#3a200e'; g.lineWidth = size * 0.11; g.strokeText(t, x, y);
    g.fillStyle = col; g.fillText(t, x, y);
    g.save(); g.beginPath(); g.rect(x - 10, y - size, w + 20, size * 0.42); g.clip(); g.fillStyle = 'rgba(255,255,255,.28)'; g.fillText(t, x, y); g.restore();
  });
}
function draw(t) {
  const L = W / H > 1.3 ? 'wide' : (W / H < 0.8 ? 'tall' : 'square');
  const u = Math.min(W, H * (L === 'wide' ? 1.0 : 1)) / 1080;
  // sky: golden hour
  const sk = g.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#ffd99a'); sk.addColorStop(0.55, '#ffab5e'); sk.addColorStop(1, '#e8763a');
  g.fillStyle = sk; g.fillRect(0, 0, W, H);
  // printer anchor
  const px = L === 'wide' ? W * 0.7 : W * 0.47, py = L === 'wide' ? H * 0.56 : (L === 'tall' ? H * 0.66 : H * 0.72);
  const ps = (L === 'wide' ? 860 : L === 'tall' ? 540 : 420) * (L === 'wide' ? H / 1080 : W / 800);
  // sun glow
  const sun = g.createRadialGradient(px, py - ps * 0.35, ps * 0.05, px, py - ps * 0.35, ps * 1.2);
  sun.addColorStop(0, 'rgba(255,250,225,.95)'); sun.addColorStop(0.35, 'rgba(255,235,180,.55)'); sun.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, H);
  // soft rings of light
  g.strokeStyle = 'rgba(255,255,255,.18)'; for (let i = 1; i <= 3; i++) { g.lineWidth = ps * 0.02; g.beginPath(); g.arc(px, py - ps * 0.35, ps * (0.5 + i * 0.28), 0, 7); g.stroke(); }
  // distant hills
  const hill = (y0, amp, col, ph) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 8) g.lineTo(x, y0 + Math.sin(x / W * 5 + ph) * amp + Math.sin(x / W * 13 + ph * 2) * amp * 0.3); g.lineTo(W, H); g.fill(); };
  hill(H * 0.66, H * 0.03, 'rgba(180,95,60,.45)', 1); hill(H * 0.74, H * 0.025, 'rgba(150,72,42,.55)', 3);
  // workbench under the printer, in the printer's own iso projection
  const K = ps / 2.7, OX = px - 0.05 * K, OY = py - ps * 0.12 + 0.225 * K;
  const P = (x, y, z) => [OX + (x - y) * K, OY + (x + y) * K / 2 - z * K];
  const f = (pts, c) => { g.beginPath(); pts.forEach((q, i) => (i ? g.lineTo(...q) : g.moveTo(...q))); g.closePath(); g.fillStyle = c; g.fill(); };
  const x0 = -1.5, x1 = 2.5, y0 = -0.4, y1 = 2.3, th = 0.28;
  g.save(); g.shadowColor = 'rgba(80,30,10,.35)'; g.shadowBlur = K * 0.4; g.shadowOffsetY = K * 0.2;
  f([P(x0, y0, 0), P(x1, y0, 0), P(x1, y1, 0), P(x0, y1, 0)], '#c98b52'); g.restore();
  f([P(x0, y1, 0), P(x1, y1, 0), P(x1, y1, -th), P(x0, y1, -th)], '#8a5530');
  f([P(x1, y0, 0), P(x1, y1, 0), P(x1, y1, -th), P(x1, y0, -th)], '#a8683c');
  g.strokeStyle = 'rgba(110,60,25,.22)'; g.lineWidth = Math.max(1, K * 0.015);
  for (let i = 1; i < 6; i++) { const yy = y0 + i * (y1 - y0) / 6; g.beginPath(); g.moveTo(...P(x0, yy, 0)); g.lineTo(...P(x1, yy, 0)); g.stroke(); }
  // a finished vase on the bench, a spool lying flat, then the printer (the game's own Sprout art) printing a figurine
  const fb = L === 'wide' ? P(-0.45, 2.0, 0) : P(1.6, 2.15, 0), drawFb = () => MD.draw(g, 'vase', ['#2FA8A0'], fb[0], fb[1], K * (L === 'wide' ? 0.27 : 0.22), 1, { time: t });
  if (L === 'wide') drawFb();
  const frac = 0.8 + 0.04 * Math.sin(t * 0.6);
  R.hero(g, 'sprout', px, py - ps * 0.12, ps, { tpl: 'figure', frac, time: t, ms: 0.34 });
  if (L === 'tall') drawFb();
  const sp = L === 'wide' ? P(2.0, 1.9, 0) : P(-0.25, 0.75, 0); const rr = K * 0.3;
  g.fillStyle = '#2a5ea8'; g.beginPath(); g.ellipse(sp[0], sp[1], rr, rr * 0.5, 0, 0, 7); g.fill();
  g.fillStyle = '#3D7BD9'; g.beginPath(); g.ellipse(sp[0], sp[1] - K * 0.1, rr, rr * 0.5, 0, 0, 7); g.fill();
  g.fillStyle = '#5b95ea'; g.beginPath(); g.ellipse(sp[0], sp[1] - K * 0.1, rr * 0.8, rr * 0.4, 0, 0, 7); g.fill();
  g.fillStyle = '#f4efe6'; g.beginPath(); g.ellipse(sp[0], sp[1] - K * 0.1, rr * 0.25, rr * 0.125, 0, 0, 7); g.fill();
  // drifting leaves + little sparkles
  const r = rnd(7);
  for (let i = 0; i < 26; i++) {
    const x0 = r() * W, y0 = r() * H, s = (6 + r() * 12) * u * (W / 1920 > 0.6 ? 1.4 : 1.6), sp2 = 6 + r() * 14;
    const x = (x0 + t * sp2 * 2 * u) % W, y = (y0 + t * sp2 * u + Math.sin(t + i) * 8 * u) % H;
    const d = Math.hypot(x - px, y - py); if (d < ps * 0.75) continue;
    cube(x, y, s * 0.75, ['#3D7BD9', '#E0473C', '#F2C230', '#2FA8A0', '#8E6BD1', '#F4EFE6'][i % 6]);
  }
  g.fillStyle = 'rgba(255,255,240,.85)';
  for (let i = 0; i < 18; i++) { const x = r() * W, y = r() * H * 0.7, s = (2 + r() * 4) * u * 1.4 * (0.6 + 0.4 * Math.sin(t * 2 + i)); g.beginPath(); g.moveTo(x, y - s * 2); g.lineTo(x + s * 0.5, y - s * 0.5); g.lineTo(x + s * 2, y); g.lineTo(x + s * 0.5, y + s * 0.5); g.lineTo(x, y + s * 2); g.lineTo(x - s * 0.5, y + s * 0.5); g.lineTo(x - s * 2, y); g.lineTo(x - s * 0.5, y - s * 0.5); g.fill(); }
  // vignette
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(90,30,10,.35)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // title
  if (L === 'wide') title(W * 0.06, H * 0.36, H * 0.19, 'left');
  else if (L === 'tall') title(W / 2, H * 0.13, W * 0.17);
  else title(W / 2, H * 0.15, W * 0.13);
}
window.drawCover = (t) => draw(t || 0);
document.fonts.load('700 40px Fredoka').then(() => { draw(+q.get('t') || 0); window.coverReady = true; });
</script></body></html>
